[workspace]
resolver = "3"
members = ["crates/*", "core/*", "apps/*"]
exclude = ["std/kernels-src"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# None of our crates goes to crates.io (cargo-deny allows path dependencies only in crates that say so).
publish = false

[workspace.dependencies]
m2-server = { path = "crates/server" }
m2-editor = { path = "crates/editor" }
m2-ir = { path = "core/ir" }
m2-kernel = { path = "std/kernels-src/kernel" }
m2-song = { path = "core/song" }
m2-runtime = { path = "core/runtime" }
m2-script = { path = "core/script" }
m2-session = { path = "core/session" }
m2-plugins = { path = "core/plugins" }
m2-play = { path = "core/play" }
m2-os = { path = "core/os" }
m2-pool = { path = "core/pool" }

anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
# Exact float parsing: data files write numbers in their shortest round-trip form, and the
# default parser misreads about one in nine of those with all their digits (FMT-8a).
serde_json = { version = "1", features = ["float_roundtrip"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
hound = "3.5"
cpal = "0.18"
# MIDI input (8b.10), only through m2-os's `midi` feature, which only m2-server turns on.
midir = "=0.11.0"
dirs = "7"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs"] }
open = "5"
toml = "1"
wasmtime = { version = "49", default-features = false, features = ["anyhow", "cranelift", "runtime", "std"] }
# Tests' hand-written kernels, text to wasm bytes: the version wasmtime's `wat` feature already
# builds, so nothing new is compiled.
wat = "1.261"
rquickjs = { version = "0.14", features = ["loader"] }
oxc = { version = "0.153", features = ["transformer", "codegen", "semantic", "ast_visit"] }
bytemuck = "1"
sha2 = "0.10"
memchr = "2"
libc = "0.2"
# Math with the same bits on every OS and CPU, the code std.wasm's math runs (PLAT-4).
libm = "0.2"
icu_normalizer = "2"
# `m2 watch`'s WebSocket client (`m2_server::socket`): the version axum's `ws` already builds, with
# its default features only (the handshake), so nothing new is compiled.
tungstenite = "0.29"
# `m2 listen --png`'s picture: the version Tauri already builds (0.17 is there too, for another crate).
png = "0.18"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The crates the audio thread runs, at full speed in the build `cargo run -p music2-desktop` makes,
# so the live engine keeps up there too (step 3a). Overflow checks stay on; Rust never reassociates
# or contracts floating point, so renders keep their bits at any opt-level.
[profile.dev.package.m2-runtime]
opt-level = 3

[profile.dev.package.m2-play]
opt-level = 3

[profile.dev.package.m2-plugins]
opt-level = 3

[profile.dev.package.m2-song]
opt-level = 3

[profile.dev.package.m2-pool]
opt-level = 3
