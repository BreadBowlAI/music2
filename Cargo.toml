[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
m2-time = { path = "crates/time" }
m2-theory = { path = "crates/theory" }
m2-dsp = { path = "crates/dsp" }
m2-project = { path = "crates/project" }
m2-graph = { path = "crates/graph" }
m2-render = { path = "crates/render" }
m2-engine = { path = "crates/engine" }
m2-audio-io = { path = "crates/audio-io" }
m2-server = { path = "crates/server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
hound = "3.5"
ureq = { version = "3", features = ["json"] }
cpal = "0.18"
dirs = "7"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs"] }
open = "5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
