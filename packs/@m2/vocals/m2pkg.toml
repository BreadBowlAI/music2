[package]
name = "@m2/vocals"
version = "1.2.0"
license = "MIT OR Apache-2.0"
description = "music2's tools for a sung voice: Tune, which moves each sung note onto the song's key, and a voice's notes, found and edited"
authors = ["music2"]
repository = "https://github.com/BreadBowlAI/music2"
tags = ["vocals", "voice", "tune", "pitch correction", "autotune", "key"]
# Its own kernels (PACK-21), built from kernels-src/ by std/build.sh (ABI-10). kernels-src/ is no
# part of the pack (PACK-20).
wasm = "kernels/vocals.wasm"

[dependencies]
# @m2/core 2.5: the song's key as `time.key` (VOX-12) came in 2.4, and Tune's pitch line (VOX-27)
# draws on an axis drawn bare, which came in 2.5; a change to @m2/core that would break it is a
# 3.0.0. It plays none of std's kernels; its picture's words use std/pictures', new in std 0.10.
"@m2/core" = "2.5"
std = "0.10"

# ---------------------------------------------------------------- its own kernels
# Port syntax as std's m2pkg.toml says. Each is called by the pack's id: `kernel("@m2/vocals:pitch", …)`.
# Tune joins them in a row (VOX-20): pitch finds the voice's pitch, snap works out how far to move
# it, shift moves it. Each is useful alone: pitch for a tuner, shift for a harmony. Each is safe
# with any input or setting: no NaN, nothing louder than what comes in.

[[kernel]]
name = "pitch"
description = "Finds a voice's pitch every 256 samples from the mono sum of its channels (YIN, through an FFT): hz between 70 and 1200 (0 with no pitch), how sure it is (clarity, 0 to 1) and its level. It looks only at the past, so it adds no latency (VOX-21)"
inputs = ["in: audio<*>"]
outputs = ["hz: control<hz>", "clarity: control<unit01>", "level: control<gain>"]

[[kernel]]
name = "snap"
description = "How many semitones to move a sung pitch: to the nearest note of the key, keeping the current note within 0.2 semitones, eased over glide seconds (0 jumps at once), times amount. With no clear pitch it eases back to 0 (VOX-22). Its meters, Tune's pitch line: heard, the pitch it hears, and note, the note of the key it moves it to, each a MIDI note number (0 with no pitch)"
inputs = [
  "hz: control<hz>",
  "clarity: control<unit01>",
  "key: control<keyset> = 4095",
  "glide: control<seconds> = 0.1 in 0..0.4",
  "amount: control<unit01> = 1",
]
outputs = ["out: control<semitones>"]
meters = ["heard: control<semitones>", "note: control<semitones>"]

[[kernel]]
name = "shift"
description = "Moves a voice by semitones and keeps its vowel colour (TD-PSOLA: a grain around each vocal pulse, laid out again at the new spacing); formant moves the colour on its own. With no clear pitch the sound passes through. Both channels use the same pulses. semitones from -7 to 12. 15 ms late (VOX-23)"
inputs = [
  "in: audio<*>",
  "semitones: control<semitones> = 0 in -7..12",
  "hz: control<hz> = 0",
  "clarity: control<unit01> = 0",
  "formant: control<semitones> = 0 in -12..12",
]
outputs = ["out: audio<*>"]
latency_s = 0.015

# ---------------------------------------------------------------- a voice's notes (VOX-40 to VOX-47)
# Two offline kernels the host runs, never song code: `notes` measures a recorded voice's file, and
# `voice` plays a clip's edited notes, phrase by phrase (RENDER-30b). They read the pitch line by
# the same code, at the same hops, so the line `voice` moves is the line the window draws.

[[kernel]]
name = "notes"
description = "The sung notes of a file, a measure (VOX-41, VOX-42): every 256 frames of the file, the voice's hz, clarity and level (pitch's reading of the window centred there), note (0 between notes, then 1, 2, 3...) and centre (that note's sung pitch, a MIDI number). A note starts where the voice starts, where its pitch moves more than 0.7 semitones and stays, or where it gets 6 dB louder, and ends where the voice stops; one under 60 ms joins the note it touches"
offline = true
hop = 256
outputs = [
  "hz: control<hz>",
  "clarity: control<unit01>",
  "level: control<gain>",
  "note: control<scalar>",
  "centre: control<semitones>",
]

[[kernel]]
name = "voice"
description = "Plays a clip's edited notes (VOX-45, RENDER-30b): one phrase of the clip, its file laid out by the time map, each moment of a note moved by move plus straighten times (pitch less the pitch line), from -7 to 12 semitones, by TD-PSOLA, so the voice keeps its colour. values: the phrase's first and last frame in the clip, the lead-in in seconds, then five numbers a note (at, length, pitch, move, straighten)"
offline = true
outputs = ["out: audio<*>"]
