[package]
name = "@m2/synths"
version = "2.0.0"
license = "MIT OR Apache-2.0"
description = "music2's synths: a polysynth's leads, pads, plucks and basses, an FM synth's keys and bells, and three simple instruments to read and copy"
authors = ["music2"]
repository = "https://github.com/BreadBowlAI/music2"
tags = ["synth", "polysynth", "fm", "keys", "bass", "pad", "lead"]
# Its own kernels (PACK-21), built from kernels-src/ by std/build.sh (ABI-10). kernels-src/ is no
# part of the pack (PACK-20).
wasm = "kernels/synths.wasm"

[dependencies]
# @m2/core 1.10 or later: the three simple instruments say `editor: { unlisted: true }` (1.10.0), and
# the sounds' cards their menus, views and groups (1.8.0).
"@m2/core" = "1.10"
# The std kernels its sounds play are all in std 0.7 and later; the voices are its own.
std = "0.7"

# ---------------------------------------------------------------- its own kernels
# Port syntax as std's m2pkg.toml says. Each is called by the pack's id: `kernel("@m2/synths:synth", …)`.
# Each is one kernel per voice: a whole instrument in one place costs far less than the same sound
# built from small kernels. Each smooths its own continuous controls, reads times and counts when a
# note starts or on its own control clock (never the host's blocks), and ends in exact silence.
# Both were std's until std 0.9, and play the same bits.

[[kernel]]
name = "synth"
description = "Polysynth voice: a unison saw and pulse stack, a sub sine and noise, driven into a 4-pole ladder lowpass with its own envelope, then an amp envelope; stereo. The level follows velocity^(2 × vel_amount), so velocity 0 is silent. `wheel` (the mod wheel) deepens the vibrato by up to half a semitone, at once. `shape` is the stack's main wave, whose level is `saw`: 0 the saw (as it always was), 1 a square (the level joins the pulse's, at `width`), 2 a triangle, 3 a sine; a change glides over a tick"
inputs = [
  "pitch: control<semitones>",
  "gate: control<unit01>",
  "velocity: control<unit01> = 0.8",
  "saw: control<unit01> = 1",
  "square: control<unit01> = 0",
  "width: control<unit01> = 0.5 in 0.05..0.95",
  "sub: control<unit01> = 0",
  "sub_octave: control<scalar> = -1 in -2..0",
  "noise: control<unit01> = 0",
  "unison: control<scalar> = 1 in 1..7",
  "detune: control<unit01> = 0.2",
  "spread: control<unit01> = 0.5",
  "drop: control<semitones> = 0 in 0..48",
  "drop_time: control<seconds> = 0.04",
  "vibrato: control<semitones> = 0 in 0..2",
  "cutoff: control<hz> = 8000",
  "resonance: control<unit01> = 0.1",
  "keytrack: control<unit01> = 0.5",
  "env: control<scalar> = 0 in -4..8",
  "f_attack: control<seconds> = 0.002",
  "f_decay: control<seconds> = 0.3",
  "f_sustain: control<unit01> = 0",
  "attack: control<seconds> = 0.003",
  "decay: control<seconds> = 0.5",
  "sustain: control<unit01> = 0.8",
  "release: control<seconds> = 0.3",
  "drive: control<db> = 0 in 0..24",
  "vel_amount: control<unit01> = 0.5",
  "level: control<db> = 0 in -24..12",
  "seed: control<scalar> = 1",
  "wheel: control<unit01> = 0",
  "shape: control<choice<saw|square|triangle|sine>> = 0",
]
outputs = ["out: audio<2>"]

[[kernel]]
name = "fm"
description = "FM voice: two sine-operator pairs (a modulator into a carrier each), the first modulator with feedback, at 2× and decimated; brightness follows velocity and key, as on an electric piano, and `drop` bends each note down into its pitch. The level follows velocity^(2 × vel_amount)"
inputs = [
  "pitch: control<semitones>",
  "gate: control<unit01>",
  "velocity: control<unit01> = 0.8",
  "ratio_a: control<scalar> = 1 in 0.5..16",
  "mod_a: control<scalar> = 1 in 0.5..16",
  "index_a: control<scalar> = 1.5 in 0..8",
  "fall_a: control<seconds> = 1",
  "ratio_b: control<scalar> = 1 in 0.5..16",
  "mod_b: control<scalar> = 14 in 0.5..32",
  "index_b: control<scalar> = 0.8 in 0..8",
  "fall_b: control<seconds> = 0.1",
  "mix_b: control<unit01> = 0.35",
  "feedback: control<unit01> = 0",
  "detune: control<scalar> = 0 in 0..20",
  "tone: control<unit01> = 0.5",
  "attack: control<seconds> = 0.002",
  "decay: control<seconds> = 3",
  "sustain: control<unit01> = 0",
  "release: control<seconds> = 0.4",
  "vel_amount: control<unit01> = 0.7",
  "level: control<db> = 0 in -24..12",
  "drop: control<semitones> = 0 in 0..48",
  "drop_time: control<seconds> = 0.04",
]
outputs = ["out: audio<1>"]
