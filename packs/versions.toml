# In short: every version of music2's own packs a release ships, with its hash. A version's files
# never change from the first release that ships it (PACK-17, PACK-18): a changed pack gets a new
# version, and a new line. Until a release ships one, a branch records the one version of each pack
# it will ship, never one for each step. `m2_song::pack::own` reads this to say which installed packs
# are music2's (PACK-19); `every_bundled_pack_is_the_version_its_record_names` checks it against
# packs/@m2/*. No release has shipped music2's own packs yet, so it holds one version of each.
