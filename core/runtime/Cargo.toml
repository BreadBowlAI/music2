[package]
name = "m2-runtime"
description = "Runs checked music2 graphs: the WebAssembly kernel host, poly voices, rendering"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["plugins", "wasmtime"]
# The CLAP host (HOST-1): `m2-plugins`' `clap`. Without it, as on the web, the runtime has no
# plugin host: each plugin a song uses is `plugin.missing`, said as one that can't play here.
plugins = ["m2-plugins/clap"]
# wasmtime, the kernel host (`src/host/wasmtime.rs`). Without it the runtime has no host and loads
# no package with kernels: what a build for the web starts from (docs/designs/live/web-engine.md).
wasmtime = ["dep:wasmtime"]

[dependencies]
m2-ir.workspace = true
m2-song.workspace = true
# Its types always: `PluginHost`, `Handle`, `Owner`, `Event`, `Blob`, `Found`, `RenderMode`.
m2-plugins = { path = "../plugins", default-features = false }
m2-os.workspace = true
m2-pool.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
# The kernel host the app runs (RENDER-32), behind the default feature `wasmtime`.
wasmtime = { workspace = true, optional = true }
bytemuck.workspace = true
hound.workspace = true
claxon.workspace = true
libm.workspace = true
# The kit's one rule for a latency in seconds (VOX-24), which the kernels count by too.
m2-kernel.workspace = true

[dev-dependencies]
wasmtime = { workspace = true, features = ["wat"] }
# The tests' store of the packs music2 ships (`m2_song::pack::test_packs`).
m2-song = { workspace = true, features = ["testing"] }
wat.workspace = true
serde_json.workspace = true
m2-std-kernels = { path = "../../std/kernels-src" }

# The web engine's probe (docs/designs/live/web-engine.md): every live kernel music2 ships, under
# wasmtime, for a browser's WebAssembly to match. Nothing of the app's runs it.
[[example]]
name = "web-probe"
path = "../../docs/designs/live/probe/wasmtime.rs"
