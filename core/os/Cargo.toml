[package]
name = "m2-os"
description = "What music2 does differently on each operating system, in one place: one folder per OS (PLAT-2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc.workspace = true
midir = { workspace = true, optional = true }

[features]
# The MIDI keyboard listener (`m2_os::midi`). Only the server turns it on, so no other crate builds
# midir and the OS MIDI libraries.
midi = ["dep:midir"]
