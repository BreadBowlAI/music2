[package]
name = "m2-session"
description = "Compiles a music2 project into something playable, with diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
m2-ir.workspace = true
m2-os.workspace = true
m2-song.workspace = true
m2-runtime.workspace = true
m2-script.workspace = true
hound.workspace = true
serde_json.workspace = true
memchr.workspace = true

[dev-dependencies]
# The kill tests' children: a signal's number, and no core dump on Linux (OS-72).
libc.workspace = true
# The probe plugin and the tests' plugin main thread (HOST-2): keyed plugins in `continues`.
m2-plugins.workspace = true

[features]
# Tests of other crates: a session whose commits go through a disk they give
# (`Session::open_with_disk`), to fail, slow down or race any of its calls.
faults = []
