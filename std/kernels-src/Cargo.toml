[package]
name = "m2-std-kernels"
description = "The std package's kernels, compiled to std/kernels/std.wasm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Built for wasm32-unknown-unknown by std/build.sh, separately from the main workspace. The one
# workspace of every kernel module music2 ships (ABI-10): the kit, std's crate and each of its own
# packs' crates, each beside its pack (PACK-20).
[workspace]
members = ["../../packs/*/*/kernels-src"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# A member of this workspace, so cargo hashes a relative path and std.wasm rebuilds to the same
# bytes in any folder (PLAT-5).
m2-kernel = { path = "kernel" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
