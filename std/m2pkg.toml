# The music2 standard library. An ordinary package: nothing here is special to the core.
#
# This file describes the kernels only: their ports and the wasm file (PKG-2). The
# components songs call (oscillators, filters, effects, instruments, the mixer) are
# declared in TypeScript in src/, each with a descriptor that gives its controls, their
# defaults and ranges, and how the editor offers it.
#
# Port syntax: "name: kind [= default] [in lo..hi]".
#   kinds: audio<1|2|*>, control<unit|*>, events<note>, and * (any kind).
#   Ports using `*` share one type variable per kernel, so `add(a: *, b: *) -> out: *`
#   adds two audio signals or two controls of the same unit.
#   units: hz db gain semitones seconds beats unit01 bipolar scalar
# A default applies only when a kernel is called directly with that input unset
# (`kernel("std:svf", { in: x })`): a component's descriptor gives what songs see (PKG-4).
# `in lo..hi` is the knob range of a number written straight into a kernel input.

[package]
name = "std"
version = "0.2.1"
license = "MIT"
description = "Oscillators, envelopes, filters, mixing, dynamics, and the instruments built from them"
wasm = "kernels/std.wasm"

# ---------------------------------------------------------------- oscillators

[[kernel]]
name = "sine"
description = "Sine oscillator"
inputs = ["freq: control<hz> = 440"]
outputs = ["out: audio<1>"]

[[kernel]]
name = "saw"
description = "Band-limited sawtooth oscillator"
inputs = ["freq: control<hz> = 440"]
outputs = ["out: audio<1>"]

[[kernel]]
name = "square"
description = "Band-limited pulse oscillator"
inputs = ["freq: control<hz> = 440", "width: control<unit01> = 0.5"]
outputs = ["out: audio<1>"]

[[kernel]]
name = "tri"
description = "Triangle oscillator"
inputs = ["freq: control<hz> = 440"]
outputs = ["out: audio<1>"]

[[kernel]]
name = "noise"
description = "White noise; the same seed always gives the same noise"
inputs = ["seed: control<scalar> = 1"]
outputs = ["out: audio<1>"]

# ---------------------------------------------------------------- envelopes and modulation

[[kernel]]
name = "adsr"
description = "Attack/decay/sustain/release envelope driven by a gate"
inputs = [
  "gate: control<unit01>",
  "attack: control<seconds> = 0.005",
  "decay: control<seconds> = 0.2",
  "sustain: control<unit01> = 0.7",
  "release: control<seconds> = 0.2",
]
outputs = ["out: control<unit01>"]

[[kernel]]
name = "follow"
description = "Envelope follower: how loud the input is right now, 0..1"
inputs = ["in: audio<*>", "attack: control<seconds> = 0.002", "release: control<seconds> = 0.12"]
outputs = ["out: control<unit01>"]

[[kernel]]
name = "lfo"
description = "Beat-synced LFO, 0..1. Shapes: 0 sine, 1 triangle, 2 saw, 3 square"
inputs = [
  "beats: control<beats>",
  "period: control<beats> = 1",
  "shape: control<scalar> = 0",
  "phase: control<unit01> = 0",
]
outputs = ["out: control<unit01>"]

# ---------------------------------------------------------------- math

[[kernel]]
name = "scale"
description = "Multiply a signal by a gain"
inputs = ["in: *", "by: control<gain> = 1"]
outputs = ["out: *"]

[[kernel]]
name = "add"
description = "Add two signals of the same kind"
inputs = ["a: *", "b: *"]
outputs = ["out: *"]

[[kernel]]
name = "blend"
description = "Crossfade: a at m = 0, b at m = 1"
inputs = ["a: *", "b: *", "m: control<unit01>"]
outputs = ["out: *"]

[[kernel]]
name = "mtof"
description = "Pitch in semitones (60 = middle C) to frequency"
inputs = ["pitch: control<semitones>"]
outputs = ["out: control<hz>"]

[[kernel]]
name = "range"
description = "Map 0..1 linearly onto lo..hi"
inputs = ["x: control<unit01>", "lo: control<*>", "hi: control<*>"]
outputs = ["out: control<*>"]

[[kernel]]
name = "xrange"
description = "Map 0..1 exponentially onto lo..hi (for frequencies and times)"
inputs = ["x: control<unit01>", "lo: control<*>", "hi: control<*>"]
outputs = ["out: control<*>"]

# ---------------------------------------------------------------- mixing

[[kernel]]
name = "gain"
description = "Gain in dB, smoothed"
inputs = ["in: audio<*>", "db: control<db> = 0"]
outputs = ["out: audio<*>"]

[[kernel]]
name = "pan"
description = "Equal-power pan of a mono signal into stereo; a stereo signal is balanced"
inputs = ["in: audio<*>", "pan: control<bipolar> = 0"]
outputs = ["out: audio<2>"]

[[kernel]]
name = "stereo"
description = "The signal as stereo, sample for sample: a mono one in both channels, a stereo one as it is"
inputs = ["in: audio<2>"]
outputs = ["out: audio<2>"]

# ---------------------------------------------------------------- filters

[[kernel]]
name = "svf"
description = "State-variable filter with lowpass, bandpass and highpass outputs"
inputs = ["in: audio<*>", "cutoff: control<hz> = 1000", "q: control<scalar> = 0.707"]
outputs = ["lp: audio<*>", "bp: audio<*>", "hp: audio<*>"]

# ---------------------------------------------------------------- time effects

[[kernel]]
name = "delay"
description = "Feedback delay, up to 2 seconds, with a dry/wet mix"
inputs = [
  "in: audio<*>",
  "time: control<seconds> = 0.25",
  "feedback: control<unit01> = 0.3",
  "mix: control<unit01> = 0.3",
]
outputs = ["out: audio<*>"]

# ---------------------------------------------------------------- dynamics and colour

[[kernel]]
name = "drive"
description = "Soft saturation"
inputs = ["in: audio<*>", "amount: control<db> = 6"]
outputs = ["out: audio<*>"]

[[kernel]]
name = "duck"
description = "Turn the input down by `depth` dB while `side` is high (sidechain)"
inputs = ["in: audio<*>", "side: control<unit01>", "depth: control<db> = -8"]
outputs = ["out: audio<*>"]

[[kernel]]
name = "limit"
description = "Peak limiter with a hard ceiling"
inputs = ["in: audio<*>", "ceiling: control<db> = -1"]
outputs = ["out: audio<*>"]

# ---------------------------------------------------------------- more effects
# The kernels of std/fx's reverb, modulation, compression, EQ, lo-fi and width.
# Each kernel is safe with any input or setting: no NaN, no runaway feedback, and
# tails that end in exact silence. Chorus, phaser, tremolo and bitcrush follow the song
# through their last input, `playing`: std/fx connects it to `time.playing`. Left out, it
# is 1, as if the song always played.

[[kernel]]
name = "reverb"
description = "Freeverb-style reverb, stereo for a stereo input; mix is an equal-power crossfade"
inputs = [
  "in: audio<*>",
  "size: control<unit01> = 0.6",
  "damping: control<unit01> = 0.5",
  "mix: control<unit01> = 0.25",
]
outputs = ["out: audio<*>"]

[[kernel]]
name = "chorus"
description = "Chorus: two sweeping delay taps per side; stereo sides sweep a quarter cycle apart. The sweep moves only while playing is 1 (left out, always)"
inputs = [
  "in: audio<*>",
  "rate: control<hz> = 0.8 in 0.05..20",
  "depth: control<unit01> = 0.5",
  "mix: control<unit01> = 0.5",
  "playing: control<unit01> = 1",
]
outputs = ["out: audio<*>"]

[[kernel]]
name = "phaser"
description = "Six-stage phaser with feedback; stereo sides sweep a quarter cycle apart. The sweep moves only while playing is 1 (left out, always)"
inputs = [
  "in: audio<*>",
  "rate: control<hz> = 0.4 in 0.05..20",
  "depth: control<unit01> = 0.7",
  "feedback: control<unit01> = 0.5",
  "mix: control<unit01> = 0.5",
  "playing: control<unit01> = 1",
]
outputs = ["out: audio<*>"]

[[kernel]]
name = "tremolo"
description = "Sine tremolo: dips the level by depth (1 = to silence), rate times a second. It pulses only while playing is 1 (left out, always)"
inputs = ["in: audio<*>", "rate: control<hz> = 5 in 0.05..20", "depth: control<unit01> = 0.5", "playing: control<unit01> = 1"]
outputs = ["out: audio<*>"]

[[kernel]]
name = "compress"
description = "Stereo-linked soft-knee compressor; ratio 1 is off"
inputs = [
  "in: audio<*>",
  "threshold: control<db> = -18",
  "ratio: control<scalar> = 3 in 1..20",
  "attack: control<seconds> = 0.01 in 0.0001..1",
  "release: control<seconds> = 0.15 in 0.001..5",
  "makeup: control<db> = 0",
]
outputs = ["out: audio<*>"]

[[kernel]]
name = "eq3"
description = "Three-band EQ: low shelf, mid bell, high shelf, each from -60 dB (a kill) to +24 dB; flat at 0 dB"
inputs = [
  "in: audio<*>",
  "low: control<db> = 0",
  "mid: control<db> = 0",
  "high: control<db> = 0",
  "low_freq: control<hz> = 200",
  "mid_freq: control<hz> = 1000",
  "high_freq: control<hz> = 4000",
]
outputs = ["out: audio<*>"]

[[kernel]]
name = "bitcrush"
description = "Bitcrusher: rounds to `bits` and holds samples at `rate` Hz. When playing goes to 1, its sample clock is put back to where it was when playing went to 0 (left out, playing is always 1)"
inputs = [
  "in: audio<*>",
  "bits: control<scalar> = 8 in 1..16",
  "rate: control<hz> = 12000",
  "mix: control<unit01> = 1",
  "playing: control<unit01> = 1",
]
outputs = ["out: audio<*>"]

[[kernel]]
name = "widen"
description = "Mid/side width: 0 mono, 1 unchanged, 2 twice as wide; widens mono input too, and stays mono-compatible"
inputs = ["in: audio<2>", "width: control<scalar> = 1.5 in 0..2"]
outputs = ["out: audio<2>"]

# ---------------------------------------------------------------- instruments
# The voices of std/synth, std/fm and std/drums. Each is one kernel per voice: a whole
# instrument in one place costs far less than the same sound built from small kernels.
# Each smooths its own continuous controls, reads times and counts when a note starts or
# on its own control clock (never the host's blocks), and ends in exact silence.

[[kernel]]
name = "synth"
description = "Polysynth voice: a unison saw and pulse stack, a sub sine and noise, driven into a 4-pole ladder lowpass with its own envelope, then an amp envelope; stereo. The level follows velocity^(2 × vel_amount), so velocity 0 is silent"
inputs = [
  "pitch: control<semitones>",
  "gate: control<unit01>",
  "velocity: control<unit01> = 0.8",
  "saw: control<unit01> = 1",
  "square: control<unit01> = 0",
  "width: control<unit01> = 0.5 in 0.05..0.95",
  "sub: control<unit01> = 0",
  "sub_octave: control<scalar> = -1 in -2..0",
  "noise: control<unit01> = 0",
  "unison: control<scalar> = 1 in 1..7",
  "detune: control<unit01> = 0.2",
  "spread: control<unit01> = 0.5",
  "drop: control<semitones> = 0 in 0..48",
  "drop_time: control<seconds> = 0.04",
  "vibrato: control<semitones> = 0 in 0..2",
  "cutoff: control<hz> = 8000",
  "resonance: control<unit01> = 0.1",
  "keytrack: control<unit01> = 0.5",
  "env: control<scalar> = 0 in -4..8",
  "f_attack: control<seconds> = 0.002",
  "f_decay: control<seconds> = 0.3",
  "f_sustain: control<unit01> = 0",
  "attack: control<seconds> = 0.003",
  "decay: control<seconds> = 0.5",
  "sustain: control<unit01> = 0.8",
  "release: control<seconds> = 0.3",
  "drive: control<db> = 0 in 0..24",
  "vel_amount: control<unit01> = 0.5",
  "level: control<db> = 0 in -24..12",
  "seed: control<scalar> = 1",
]
outputs = ["out: audio<2>"]

[[kernel]]
name = "fm"
description = "FM voice: two sine-operator pairs (a modulator into a carrier each), the first modulator with feedback, at 2× and decimated; brightness follows velocity and key, as on an electric piano, and `drop` bends each note down into its pitch. The level follows velocity^(2 × vel_amount)"
inputs = [
  "pitch: control<semitones>",
  "gate: control<unit01>",
  "velocity: control<unit01> = 0.8",
  "ratio_a: control<scalar> = 1 in 0.5..16",
  "mod_a: control<scalar> = 1 in 0.5..16",
  "index_a: control<scalar> = 1.5 in 0..8",
  "fall_a: control<seconds> = 1",
  "ratio_b: control<scalar> = 1 in 0.5..16",
  "mod_b: control<scalar> = 14 in 0.5..32",
  "index_b: control<scalar> = 0.8 in 0..8",
  "fall_b: control<seconds> = 0.1",
  "mix_b: control<unit01> = 0.35",
  "feedback: control<unit01> = 0",
  "detune: control<scalar> = 0 in 0..20",
  "tone: control<unit01> = 0.5",
  "attack: control<seconds> = 0.002",
  "decay: control<seconds> = 3",
  "sustain: control<unit01> = 0",
  "release: control<seconds> = 0.4",
  "vel_amount: control<unit01> = 0.7",
  "level: control<db> = 0 in -24..12",
  "drop: control<semitones> = 0 in 0..48",
  "drop_time: control<seconds> = 0.04",
]
outputs = ["out: audio<1>"]

[[kernel]]
name = "drum"
description = "Drum voice, 808 and 909 style. `model` -1 plays the General MIDI kit by pitch (kick, snare, clap, hats, toms, rim, cowbell, cymbals, shakers); 0 kick, 1 snare, 2 clap, 3 hats (G#2 pedal, A#2 open), 4 tom (A2 at its tune), 5 rim, 6 cowbell, 7 cymbal, 8 shaker. `hits` (from drumhit) fades it out when its choke group is hit again; `count` (from hitcount, outside the voices) seeds each hit's noise and metal; the levels move groups of the kit"
inputs = [
  "pitch: control<semitones>",
  "velocity: control<unit01> = 0.8",
  "hits: audio<1>",
  "count: audio<1>",
  "model: control<scalar> = -1",
  "kick_tune: control<hz> = 48 in 30..120",
  "kick_decay: control<seconds> = 0.45",
  "punch: control<unit01> = 0.5",
  "snare_tune: control<hz> = 190 in 100..400",
  "snap: control<unit01> = 0.6",
  "snare_decay: control<seconds> = 0.18",
  "clap_tone: control<hz> = 1200",
  "clap_decay: control<seconds> = 0.25",
  "hat_tone: control<hz> = 8000",
  "hat_decay: control<seconds> = 0.045",
  "open_decay: control<seconds> = 0.45",
  "tom_tune: control<hz> = 130",
  "tom_decay: control<seconds> = 0.35",
  "rim_tone: control<hz> = 1700",
  "bell_tune: control<hz> = 540",
  "cymbal_decay: control<seconds> = 1.6",
  "shake_decay: control<seconds> = 0.06",
  "drive: control<db> = 0 in 0..24",
  "kick_level: control<db> = 0 in -24..12",
  "snare_level: control<db> = 0 in -24..12",
  "hat_level: control<db> = 0 in -24..12",
  "tom_level: control<db> = 0 in -24..12",
  "perc_level: control<db> = 0 in -24..12",
]
outputs = ["out: audio<1>"]

[[kernel]]
name = "sampler"
description = "Sampler voice: plays one of its audio files (its assets) from the start, picked when the note starts by the note ranges in its values (root, lowest, highest for each file; left out, 60, 0, 127), sped up by 2^((pitch + tune - root) / 12) and the file's rate over the song's, read with the cubic Hermite formula clips use. `mode` 0 plays to the file's end whatever the note does (one-shot); 1 stops with the note, over `release` (gated). The level follows velocity; stereo out"
inputs = [
  "pitch: control<semitones>",
  "gate: control<unit01>",
  "velocity: control<unit01> = 0.8",
  "tune: control<semitones> = 0 in -24..24",
  "level: control<db> = 0 in -24..12",
  "attack: control<seconds> = 0 in 0..5",
  "release: control<seconds> = 0.05 in 0..5",
  "mode: control<scalar> = 0 in 0..1",
]
outputs = ["out: audio<2>"]

[[kernel]]
name = "notecv"
description = "A note as audio, for std's mono: its gate on the left; on the right, a code holding its pitch and velocity on the note's first sample, and the code negated on the sample its gate falls"
inputs = ["pitch: control<semitones>", "gate: control<unit01>", "velocity: control<unit01> = 0.8"]
outputs = ["out: audio<2>"]

[[kernel]]
name = "mono"
description = "One note at a time, from two notecv polys: the latest note's gate, pitch and velocity; a note that starts while another is held slides to its pitch over `glide` seconds without restarting the envelopes, and when it ends the newest note still held sounds again, sliding back"
inputs = ["last: audio<2>", "held: audio<2>", "glide: control<seconds> = 0 in 0..2"]
outputs = ["gate: control<unit01>", "pitch: control<semitones>", "velocity: control<unit01>"]

[[kernel]]
name = "drumhit"
description = "Marks the start of a drum note for std's drums: on its first sample, 16^group for the choke group of its drum (by General MIDI pitch, or `model`) plus 16^5 for every hit, else 0"
inputs = ["pitch: control<semitones>", "model: control<scalar> = -1"]
outputs = ["out: audio<1>"]

[[kernel]]
name = "hitcount"
description = "How many drum hits a lane has played, from the hits drumhit marks (a poly of it), this sample's included, wrapping at 2^24: read on a hit's first sample, a seed that changes from hit to hit, the same in every render and in live playback from 0. It counts notes, never samples"
inputs = ["hits: audio<1>"]
outputs = ["out: audio<1>"]
