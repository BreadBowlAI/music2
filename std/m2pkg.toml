# The music2 standard library. An ordinary package: nothing here is special to the core.
#
# Port syntax: "name: kind [= default]".
#   kinds: audio<1|2|*>, control<unit|*>, events<note>, and * (any kind).
#   Ports using `*` share one type variable per kernel, so `add(a: *, b: *) -> out: *`
#   adds two audio signals or two controls of the same unit.
#   units: hz db gain semitones seconds beats unit01 bipolar scalar

[package]
name = "std"
version = "0.1.0"
license = "MIT"
description = "Oscillators, envelopes, filters, mixing, dynamics, and the instruments built from them"
wasm = "kernels/std.wasm"

# ---------------------------------------------------------------- effects
# Offered by the editor after any audio: each takes the audio first and returns audio.
# `category` is where the editor lists it (Filter, EQ, Dynamics, Distortion,
# Delay & Reverb, Modulation, Utility; Other by default). `args` is written after the
# audio when the effect is added (`args = "1000"` gives `lowpass(x, 1000)`): every
# number in it is a declared control of the effect, so it shows up as a knob.

[[effect]]
module = "std/filter"
name = "lowpass"
category = "Filter"
description = "Darker: removes the highs above the cutoff"
args = "1000"

[[effect]]
module = "std/filter"
name = "highpass"
category = "Filter"
description = "Thinner: removes the lows below the cutoff"
args = "200"

[[effect]]
module = "std/filter"
name = "bandpass"
category = "Filter"
description = "Keeps only a band around the cutoff, like a telephone"
args = "1000"

[[effect]]
module = "std/filter"
name = "notch"
category = "Filter"
description = "Cuts a narrow band out around the cutoff"
args = "1000"

[[effect]]
module = "std/fx"
name = "limit"
category = "Dynamics"
description = "Stops peaks from clipping"
args = "-1"

[[effect]]
module = "std/fx"
name = "drive"
category = "Distortion"
description = "Warm saturation, from gentle grit to crunch"
args = "6"

[[effect]]
module = "std/fx"
name = "delay"
category = "Delay & Reverb"
description = "Echoes that repeat and fade away"
args = "{ time: 0.25, feedback: 0.3, mix: 0.3 }"

[[effect]]
module = "std/dsp"
name = "gain"
category = "Utility"
description = "Volume: louder or quieter, in dB"
args = "0"

[[effect]]
module = "std/dsp"
name = "pan"
category = "Utility"
description = "Places a mono sound left or right"
args = "0"

# ---------------------------------------------------------------- oscillators

[[kernel]]
name = "sine"
description = "Sine oscillator"
inputs = ["freq: control<hz> = 440"]
outputs = ["out: audio<1>"]

[[kernel]]
name = "saw"
description = "Band-limited sawtooth oscillator"
inputs = ["freq: control<hz> = 440"]
outputs = ["out: audio<1>"]

[[kernel]]
name = "square"
description = "Band-limited pulse oscillator"
inputs = ["freq: control<hz> = 440", "width: control<unit01> = 0.5"]
outputs = ["out: audio<1>"]

[[kernel]]
name = "tri"
description = "Triangle oscillator"
inputs = ["freq: control<hz> = 440"]
outputs = ["out: audio<1>"]

[[kernel]]
name = "noise"
description = "White noise; the same seed always gives the same noise"
inputs = ["seed: control<scalar> = 1"]
outputs = ["out: audio<1>"]

# ---------------------------------------------------------------- envelopes and modulation

[[kernel]]
name = "adsr"
description = "Attack/decay/sustain/release envelope driven by a gate"
inputs = [
  "gate: control<unit01>",
  "attack: control<seconds> = 0.005",
  "decay: control<seconds> = 0.2",
  "sustain: control<unit01> = 0.7",
  "release: control<seconds> = 0.2",
]
outputs = ["out: control<unit01>"]

[[kernel]]
name = "follow"
description = "Envelope follower: how loud the input is right now, 0..1"
inputs = ["in: audio<*>", "attack: control<seconds> = 0.002", "release: control<seconds> = 0.12"]
outputs = ["out: control<unit01>"]

[[kernel]]
name = "lfo"
description = "Beat-synced LFO, 0..1. Shapes: 0 sine, 1 triangle, 2 saw, 3 square"
inputs = [
  "beats: control<beats>",
  "period: control<beats> = 1",
  "shape: control<scalar> = 0",
  "phase: control<unit01> = 0",
]
outputs = ["out: control<unit01>"]

# ---------------------------------------------------------------- math

[[kernel]]
name = "scale"
description = "Multiply a signal by a gain"
inputs = ["in: *", "by: control<gain> = 1"]
outputs = ["out: *"]

[[kernel]]
name = "add"
description = "Add two signals of the same kind"
inputs = ["a: *", "b: *"]
outputs = ["out: *"]

[[kernel]]
name = "blend"
description = "Crossfade: a at m = 0, b at m = 1"
inputs = ["a: *", "b: *", "m: control<unit01>"]
outputs = ["out: *"]

[[kernel]]
name = "mtof"
description = "Pitch in semitones (60 = middle C) to frequency"
inputs = ["pitch: control<semitones>"]
outputs = ["out: control<hz>"]

[[kernel]]
name = "range"
description = "Map 0..1 linearly onto lo..hi"
inputs = ["x: control<unit01>", "lo: control<*>", "hi: control<*>"]
outputs = ["out: control<*>"]

[[kernel]]
name = "xrange"
description = "Map 0..1 exponentially onto lo..hi (for frequencies and times)"
inputs = ["x: control<unit01>", "lo: control<*>", "hi: control<*>"]
outputs = ["out: control<*>"]

# ---------------------------------------------------------------- mixing

[[kernel]]
name = "gain"
description = "Gain in dB, smoothed"
inputs = ["in: audio<*>", "db: control<db> = 0"]
outputs = ["out: audio<*>"]

[[kernel]]
name = "pan"
description = "Equal-power pan of a mono signal into stereo; a stereo signal is balanced"
inputs = ["in: audio<*>", "pan: control<bipolar> = 0"]
outputs = ["out: audio<2>"]

# ---------------------------------------------------------------- filters

[[kernel]]
name = "svf"
description = "State-variable filter with lowpass, bandpass and highpass outputs"
inputs = ["in: audio<*>", "cutoff: control<hz> = 1000", "q: control<scalar> = 0.707"]
outputs = ["lp: audio<*>", "bp: audio<*>", "hp: audio<*>"]

# ---------------------------------------------------------------- time effects

[[kernel]]
name = "delay"
description = "Feedback delay, up to 2 seconds, with a dry/wet mix"
inputs = [
  "in: audio<*>",
  "time: control<seconds> = 0.25",
  "feedback: control<unit01> = 0.3",
  "mix: control<unit01> = 0.3",
]
outputs = ["out: audio<*>"]

# ---------------------------------------------------------------- dynamics and colour

[[kernel]]
name = "drive"
description = "Soft saturation"
inputs = ["in: audio<*>", "amount: control<db> = 6"]
outputs = ["out: audio<*>"]

[[kernel]]
name = "duck"
description = "Turn the input down by `depth` dB while `side` is high (sidechain)"
inputs = ["in: audio<*>", "side: control<unit01>", "depth: control<db> = -8"]
outputs = ["out: audio<*>"]

[[kernel]]
name = "limit"
description = "Peak limiter with a hard ceiling"
inputs = ["in: audio<*>", "ceiling: control<db> = -1"]
outputs = ["out: audio<*>"]

# ---------------------------------------------------------------- more effects
# Reverb, modulation, compression, EQ, lo-fi and width (std/fx), and their kernels.
# Each kernel is safe with any input or setting: no NaN, no runaway feedback, and
# tails that end in exact silence.

[[effect]]
module = "std/fx"
name = "reverb"
category = "Delay & Reverb"
description = "Space: the sound of a room or a hall around it"
args = "{ size: 0.6, damping: 0.5, mix: 0.25 }"

[[effect]]
module = "std/fx"
name = "chorus"
category = "Modulation"
description = "Thicker and wider, with a gentle shimmer"
args = "{ rate: 0.8, depth: 0.5, mix: 0.5 }"

[[effect]]
module = "std/fx"
name = "phaser"
category = "Modulation"
description = "A swirling, sweeping whoosh"
args = "{ rate: 0.4, depth: 0.7, feedback: 0.5, mix: 0.5 }"

[[effect]]
module = "std/fx"
name = "tremolo"
category = "Modulation"
description = "Pulses the volume up and down"
args = "{ rate: 5, depth: 0.5 }"

[[effect]]
module = "std/fx"
name = "compress"
category = "Dynamics"
description = "Evens out loud and quiet moments so the sound sits steady"
args = "{ threshold: -18, ratio: 3, attack: 0.01, release: 0.15, makeup: 4 }"

[[effect]]
module = "std/fx"
name = "eq3"
category = "EQ"
description = "Bass, middle and treble, each up or down in dB"
args = "{ low: 0, mid: 0, high: 0 }"

[[effect]]
module = "std/fx"
name = "bitcrush"
category = "Distortion"
description = "Lo-fi digital crunch, like an old sampler"
args = "{ bits: 8, rate: 12000, mix: 1 }"

[[effect]]
module = "std/fx"
name = "widen"
category = "Utility"
description = "Makes the stereo image wider, or narrower toward mono"
args = "{ width: 1.5 }"

[[kernel]]
name = "reverb"
description = "Freeverb-style reverb, stereo for a stereo input; mix is an equal-power crossfade"
inputs = [
  "in: audio<*>",
  "size: control<unit01> = 0.6",
  "damping: control<unit01> = 0.5",
  "mix: control<unit01> = 0.25",
]
outputs = ["out: audio<*>"]

[[kernel]]
name = "chorus"
description = "Chorus: two sweeping delay taps per side; stereo sides sweep a quarter cycle apart"
inputs = [
  "in: audio<*>",
  "rate: control<hz> = 0.8 in 0.05..20",
  "depth: control<unit01> = 0.5",
  "mix: control<unit01> = 0.5",
]
outputs = ["out: audio<*>"]

[[kernel]]
name = "phaser"
description = "Six-stage phaser with feedback; stereo sides sweep a quarter cycle apart"
inputs = [
  "in: audio<*>",
  "rate: control<hz> = 0.4 in 0.05..20",
  "depth: control<unit01> = 0.7",
  "feedback: control<unit01> = 0.5",
  "mix: control<unit01> = 0.5",
]
outputs = ["out: audio<*>"]

[[kernel]]
name = "tremolo"
description = "Sine tremolo: dips the level by depth (1 = to silence), rate times a second"
inputs = ["in: audio<*>", "rate: control<hz> = 5 in 0.05..20", "depth: control<unit01> = 0.5"]
outputs = ["out: audio<*>"]

[[kernel]]
name = "compress"
description = "Stereo-linked soft-knee compressor; ratio 1 is off"
inputs = [
  "in: audio<*>",
  "threshold: control<db> = -18",
  "ratio: control<scalar> = 3 in 1..20",
  "attack: control<seconds> = 0.01 in 0.0001..1",
  "release: control<seconds> = 0.15 in 0.001..5",
  "makeup: control<db> = 0",
]
outputs = ["out: audio<*>"]

[[kernel]]
name = "eq3"
description = "Three-band EQ: low shelf, mid bell, high shelf, each from -60 dB (a kill) to +24 dB; flat at 0 dB"
inputs = [
  "in: audio<*>",
  "low: control<db> = 0",
  "mid: control<db> = 0",
  "high: control<db> = 0",
  "low_freq: control<hz> = 200",
  "mid_freq: control<hz> = 1000",
  "high_freq: control<hz> = 4000",
]
outputs = ["out: audio<*>"]

[[kernel]]
name = "bitcrush"
description = "Bitcrusher: rounds to `bits` and holds samples at `rate` Hz"
inputs = [
  "in: audio<*>",
  "bits: control<scalar> = 8 in 1..16",
  "rate: control<hz> = 12000",
  "mix: control<unit01> = 1",
]
outputs = ["out: audio<*>"]

[[kernel]]
name = "widen"
description = "Mid/side width: 0 mono, 1 unchanged, 2 twice as wide; widens mono input too, and stays mono-compatible"
inputs = ["in: audio<2>", "width: control<scalar> = 1.5 in 0..2"]
outputs = ["out: audio<2>"]
