# The music2 standard library. An ordinary package: nothing here is special to the core.
#
# This file describes the kernels only: their ports and the wasm file (PKG-2). The
# components songs call (oscillators, filters, envelopes, the Sampler, the mixer and the
# effects mixing needs) are declared in TypeScript in src/, each with a descriptor that gives
# its controls, their defaults and ranges, and how the editor offers it. std is the toolbox
# (PKG-17): the sounds made from these kernels are the packs @m2/synths, @m2/drums and
# @m2/effects (packs/@m2/), which call them by id. A kernel only one pack's sounds play is that
# pack's own, built beside it (PACK-21): @m2/effects' bitcrusher since std 0.8; since std 0.9 the
# polysynth's and the FM synth's voices (@m2/synths), the drum voice (@m2/drums), and delay,
# reverb, phaser, tremolo and widen (@m2/effects).
#
# Port syntax: "name: kind [= default] [in lo..hi]".
#   kinds: audio<1|2|*>, control<unit|*>, events<note>, and * (any kind).
#   Ports using `*` share one type variable per kernel, so `add(a: *, b: *) -> out: *`
#   adds two audio signals or two controls of the same unit.
#   units: hz db gain semitones seconds beats unit01 bipolar scalar
# A default applies only when a kernel is called directly with that input unset
# (`kernel("std:svf", { in: x })`): a component's descriptor gives what songs see (PKG-4).
# `in lo..hi` is the knob range of a number written straight into a kernel input.

[package]
name = "std"
version = "0.9.0"
license = "MIT OR Apache-2.0"
description = "The toolbox sounds are made of: oscillators, envelopes, filters, the Sampler, the mixer, the effects mixing needs, and the kernels they are built on"
wasm = "kernels/std.wasm"

# ---------------------------------------------------------------- oscillators

[[kernel]]
name = "sine"
description = "Sine oscillator"
inputs = ["freq: control<hz> = 440"]
outputs = ["out: audio<1>"]

[[kernel]]
name = "saw"
description = "Band-limited sawtooth oscillator"
inputs = ["freq: control<hz> = 440"]
outputs = ["out: audio<1>"]

[[kernel]]
name = "square"
description = "Band-limited pulse oscillator"
inputs = ["freq: control<hz> = 440", "width: control<unit01> = 0.5"]
outputs = ["out: audio<1>"]

[[kernel]]
name = "tri"
description = "Triangle oscillator"
inputs = ["freq: control<hz> = 440"]
outputs = ["out: audio<1>"]

[[kernel]]
name = "noise"
description = "White noise; the same seed always gives the same noise"
inputs = ["seed: control<scalar> = 1"]
outputs = ["out: audio<1>"]

# ---------------------------------------------------------------- envelopes and modulation

[[kernel]]
name = "adsr"
description = "Attack/decay/sustain/release envelope driven by a gate"
inputs = [
  "gate: control<unit01>",
  "attack: control<seconds> = 0.005",
  "decay: control<seconds> = 0.2",
  "sustain: control<unit01> = 0.7",
  "release: control<seconds> = 0.2",
]
outputs = ["out: control<unit01>"]

[[kernel]]
name = "follow"
description = "Envelope follower: how loud the input is right now, 0..1"
inputs = ["in: audio<*>", "attack: control<seconds> = 0.002", "release: control<seconds> = 0.12"]
outputs = ["out: control<unit01>"]

[[kernel]]
name = "lfo"
description = "Beat-synced LFO, 0..1. Shapes: 0 sine, 1 triangle, 2 saw, 3 square"
inputs = [
  "beats: control<beats>",
  "period: control<beats> = 1",
  "shape: control<scalar> = 0",
  "phase: control<unit01> = 0",
]
outputs = ["out: control<unit01>"]

# ---------------------------------------------------------------- math

[[kernel]]
name = "scale"
description = "Multiply a signal by a gain"
inputs = ["in: *", "by: control<gain> = 1"]
outputs = ["out: *"]

[[kernel]]
name = "add"
description = "Add two signals of the same kind"
inputs = ["a: *", "b: *"]
outputs = ["out: *"]

[[kernel]]
name = "blend"
description = "Crossfade: a at m = 0, b at m = 1"
inputs = ["a: *", "b: *", "m: control<unit01>"]
outputs = ["out: *"]

[[kernel]]
name = "mtof"
description = "Pitch in semitones (60 = middle C) to frequency"
inputs = ["pitch: control<semitones>"]
outputs = ["out: control<hz>"]

[[kernel]]
name = "range"
description = "Map 0..1 linearly onto lo..hi"
inputs = ["x: control<unit01>", "lo: control<*>", "hi: control<*>"]
outputs = ["out: control<*>"]

[[kernel]]
name = "xrange"
description = "Map 0..1 exponentially onto lo..hi (for frequencies and times)"
inputs = ["x: control<unit01>", "lo: control<*>", "hi: control<*>"]
outputs = ["out: control<*>"]

# ---------------------------------------------------------------- mixing

[[kernel]]
name = "gain"
description = "Gain in dB, smoothed"
inputs = ["in: audio<*>", "db: control<db> = 0"]
outputs = ["out: audio<*>"]

[[kernel]]
name = "pan"
description = "Equal-power pan of a mono signal into stereo; a stereo signal is balanced"
inputs = ["in: audio<*>", "pan: control<bipolar> = 0"]
outputs = ["out: audio<2>"]

[[kernel]]
name = "stereo"
description = "The signal as stereo, sample for sample: a mono one in both channels, a stereo one as it is"
inputs = ["in: audio<2>"]
outputs = ["out: audio<2>"]

# ---------------------------------------------------------------- filters

[[kernel]]
name = "svf"
description = "State-variable filter with lowpass, bandpass and highpass outputs"
inputs = ["in: audio<*>", "cutoff: control<hz> = 1000", "q: control<scalar> = 0.707"]
outputs = ["lp: audio<*>", "bp: audio<*>", "hp: audio<*>"]

# ---------------------------------------------------------------- dynamics and colour

[[kernel]]
name = "drive"
description = "Soft saturation"
inputs = ["in: audio<*>", "amount: control<db> = 6"]
outputs = ["out: audio<*>"]

[[kernel]]
name = "duck"
description = "Turn the input down by `depth` dB while `side` is high (sidechain)"
inputs = ["in: audio<*>", "side: control<unit01>", "depth: control<db> = -8"]
outputs = ["out: audio<*>"]

[[kernel]]
name = "limit"
description = "Peak limiter with a hard ceiling"
inputs = ["in: audio<*>", "ceiling: control<db> = -1"]
outputs = ["out: audio<*>"]

# ---------------------------------------------------------------- more effects
# The chorus (@m2/effects' and @m2/synths' strings'), and std/fx's compression and EQ. Each kernel
# is safe with any input or setting: no NaN, no runaway feedback, and tails that end in exact
# silence. The chorus follows the song through its last input, `playing`: @m2/effects connects it
# to `time.playing`. Left out, it is 1, as if the song always played. @m2/effects' own kernels are
# the bitcrusher (since std 0.8), and delay, reverb, phaser, tremolo and widen (since std 0.9,
# PACK-21).

[[kernel]]
name = "chorus"
description = "Chorus: two sweeping delay taps per side; stereo sides sweep a quarter cycle apart. The sweep moves only while playing is 1 (left out, always)"
inputs = [
  "in: audio<*>",
  "rate: control<hz> = 0.8 in 0.05..20",
  "depth: control<unit01> = 0.5",
  "mix: control<unit01> = 0.5",
  "playing: control<unit01> = 1",
]
outputs = ["out: audio<*>"]

[[kernel]]
name = "compress"
description = "Stereo-linked soft-knee compressor; ratio 1 is off"
inputs = [
  "in: audio<*>",
  "threshold: control<db> = -18",
  "ratio: control<scalar> = 3 in 1..20",
  "attack: control<seconds> = 0.01 in 0.0001..1",
  "release: control<seconds> = 0.15 in 0.001..5",
  "makeup: control<db> = 0",
]
outputs = ["out: audio<*>"]

[[kernel]]
name = "eq3"
description = "Three-band EQ: low shelf, mid bell, high shelf, each from -60 dB (a kill) to +24 dB; flat at 0 dB"
inputs = [
  "in: audio<*>",
  "low: control<db> = 0",
  "mid: control<db> = 0",
  "high: control<db> = 0",
  "low_freq: control<hz> = 200",
  "mid_freq: control<hz> = 1000",
  "high_freq: control<hz> = 4000",
]
outputs = ["out: audio<*>"]

# ---------------------------------------------------------------- the Sampler
# std/sampler's voices, and what counts its notes. Each reads times and counts when a note starts
# or on its own clock (never the host's blocks), and ends in exact silence. The instrument voices
# that were std's are their packs' own since std 0.9 (PACK-21): `@m2/synths:synth`,
# `@m2/synths:fm` and `@m2/drums:drum`.

[[kernel]]
name = "sampler"
description = "Sampler voice: plays one of its audio files (its assets) from the start, picked when the note starts by the note ranges in its values (root, lowest, highest for each file; left out, 60, 0, 127), sped up by 2^((pitch + tune - root) / 12) and the file's rate over the song's, read with the cubic Hermite formula clips use. `mode` 0 plays to the file's end whatever the note does (one-shot); 1 stops with the note, over `release` (gated). The level is level × (1 - veltrack + veltrack × velocity), read when the note starts; stereo out"
inputs = [
  "pitch: control<semitones>",
  "gate: control<unit01>",
  "velocity: control<unit01> = 0.8",
  "tune: control<semitones> = 0 in -24..24",
  "level: control<db> = 0 in -24..12",
  "attack: control<seconds> = 0 in 0..5",
  "release: control<seconds> = 0.05 in 0..5",
  "mode: control<scalar> = 0 in 0..1",
  "veltrack: control<unit01> = 1 in 0..1",
]
outputs = ["out: audio<2>"]

# std:regions plays std/sampler's `regions` (architecture.md, PKG-15 and PKG-16): the sampler voice
# above, with regions in its values instead of zones. Its assets are the files, each once. Its values:
#   [0]                  how many values each region takes: 15 (a region with fewer takes the
#                        defaults for the rest; values past the ones it knows are skipped)
#   then, region after region, 15 values each:
#    0 file      which asset, from 0          8 trigger   0 attack, 1 release
#    1 root      the note it was recorded at  9 loop start a frame of the file, or -1 for no loop
#    2, 3 keys   lowest, highest note        10 loop end   the loop's last frame, both played
#    4, 5 velocity lowest, highest, 1..127   11 tune      cents
#    6, 7 round robin: position, of          12 volume    dB
#                                            13 pan       -1..1
#                                            14 offset    frames into the file it starts from
# `count` is how many times notes have started on the lane (std:hitcount of a one-voice poly of
# std:drumhit), or on the note's key (its `keyCount`, with std/sampler's `turns: "key"`), read when
# the note starts: its turn is ((count - 1) mod of) + 1. Left out, 1.
[[kernel]]
name = "regions"
description = "Sampler voice for regions: when a note starts, every attack region whose keys hold its pitch, whose velocity range holds its velocity (round(velocity × 127), 1 to 127) and whose round robin position is its turn (from `count`) plays from its offset, summed; when it ends, the release regions that match it start and play to their end. A region with a loop loops from its end to its start while the note is held, crossfaded over up to 5 ms, then plays on. Each plays as std:sampler's file does, with its tune, volume and pan; stereo out"
inputs = [
  "pitch: control<semitones>",
  "gate: control<unit01>",
  "velocity: control<unit01> = 0.8",
  "tune: control<semitones> = 0 in -24..24",
  "level: control<db> = 0 in -24..12",
  "attack: control<seconds> = 0 in 0..5",
  "release: control<seconds> = 0.05 in 0..5",
  "mode: control<scalar> = 0 in 0..1",
  "veltrack: control<unit01> = 1 in 0..1",
  "count: audio<1>",
]
outputs = ["out: audio<2>"]

[[kernel]]
name = "drumhit"
description = "Marks the start of a note for @m2/drums' drum voices (and, in one voice, the note starts std/sampler counts for its round robin): on its first sample, 16^group for the choke group of its drum (by General MIDI pitch, or `model`) plus 16^5 for every hit, else 0"
inputs = ["pitch: control<semitones>", "model: control<scalar> = -1"]
outputs = ["out: audio<1>"]

[[kernel]]
name = "hitcount"
description = "How many drum hits a lane has played, from the hits drumhit marks (a poly of it), this sample's included, wrapping at 2^24: read on a hit's first sample, a seed that changes from hit to hit, the same in every render and in live playback from 0. It counts notes, never samples"
inputs = ["hits: audio<1>"]
outputs = ["out: audio<1>"]

# ---------------------------------------------------------------- offline kernels
# Run by music2 off the audio thread to make something from a file, never by song code
# (`kernel.offline`): no inputs, the source is the kernel's asset 0, and the time map and the
# values are the host's (docs/kernel-abi.md, Offline kernels).

[[kernel]]
name = "stretch"
description = "Time-stretch (WSOLA), the stretch of every warped clip: asset 0 laid out by the time map, its pitch kept, then transposed by values[0] semitones and brought to the song's rate. Channels share one alignment; the match is normalized by loudness"
offline = true
outputs = ["out: audio<*>"]
