# TEMP (track mac-nightly): nightly.yml's macos job as it is, on each push to this branch (the
# nightly runs only on main). Taken out before the pull request.
name: Mac probe

on:
  push:
    branches: [mac-nightly]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 150
    env:
      M2_NO_PLUGINS: 1
      M2_LATE_SLEEPS: 1
      M2_PR_JOBS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/m2-tools
          key: m2-tools-${{ runner.os }}-${{ hashFiles('ci/tools.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: chrome-headless-shell-133.0.6943.141-${{ runner.os }}
      - run: ci/pr.sh toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target/pr
          shared-key: nightly-macos
          save-if: false
      - run: ci/pr.sh rust --all
      - if: ${{ !cancelled() }}
        run: ci/pr.sh models
      - if: ${{ !cancelled() }}
        run: ci/pr.sh suites --all
      - if: ${{ !cancelled() }}
        run: ci/pr.sh renders
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-macos
          path: |
            ~/m2-check/
            target/nextest/default/junit.xml
          retention-days: 3
