# .github/workflows/nightly.yml: the nightly tier, once a day on main (and by hand from the Actions
# tab).
#
# In short: everything ci/check.sh does but the timing gates, on GitHub's Linux machine
# (ci/check.sh --nightly: every Rust test, every browser suite one at a time, the tests the PR tier
# leaves out among them, the pool's models, the app on an invisible screen, the mac lint, every
# check of the PR tier, and RustSec's advisories for both Cargo.lock files), and a Mac: the build,
# every Rust test and every browser suite but those that need sleeps on time (M2_LATE_SLEEPS,
# below), and the pool's models. Only once the repo is public:
# Actions minutes are free only for public repos, and a private repo's included minutes would go on
# this alone. When a job fails or is cancelled (a job that runs past its timeout is cancelled: a
# hang), one issue, "Nightly failed", gets the run's link; when a test or suite passed only on its
# retry, one issue, "Flaky tests", names each with the nights it was named on. Both jobs keep their
# logs every night, 14 days.
# The timing gates never run here: a shared cloud machine can't judge real-time audio (ci/nightly.sh
# runs them on a quiet maintainer machine).

name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  M2_PLUGINS_MIRROR: ${{ github.server_url }}/${{ github.repository }}/releases/download/test-plugins

# Both jobs: only on main, and only when the repo is public. visibility == 'public' fails closed:
# were the field ever missing from the event, the job is skipped, never billed (private == false
# would be true then: GitHub compares null and false as the number 0).
jobs:
  linux:
    if: github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      flaky: ${{ steps.flaky.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu's packages, the .debs from the cache when it has them (ci/apt.sh says how each is
      # checked before use); saved straight after, so a job that fails later still saves them.
      - id: apt
        run: ci/apt.sh key check
      - id: debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/m2-apt
          key: ${{ steps.apt.outputs.key }}
          restore-keys: ${{ steps.apt.outputs.restore }}
      - run: ci/apt.sh check
      - if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/m2-apt
          key: ${{ steps.apt.outputs.key }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/m2-tools
          key: m2-tools-${{ runner.os }}-${{ hashFiles('ci/tools.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: chrome-headless-shell-133.0.6943.141-${{ runner.os }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/m2-test-plugins/dl
          key: m2-plugins-${{ hashFiles('ci/plugins.sha256') }}
      - run: ci/plugins.sh
      - run: ci/pr.sh toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target/nightly
            std/kernels-src -> ../../target/nightly
          shared-key: nightly
      # A hang (the full check's cargo test has no limit per test): after 165 minutes, timeout sends
      # Ctrl-C's signal to the whole process group, so the stuck test ends and check.sh's trap still
      # writes the summary and the logs' .tgz for the upload below. The runner's own cancel would
      # signal only the step's shell, never check.sh, whose trap would then never run. -k: a kill 2
      # minutes later if that hangs too; the step's limit and the job's are the last backstops.
      - run: timeout -s INT -k 2m 165m ci/check.sh --nightly
        timeout-minutes: 170
      # What passed only on a retry (ci/check.sh's list, and ci/pr.sh's in each pr-<step>/), for
      # the report job's "Flaky tests" issue.
      - id: flaky
        if: always()
        run: ci/nightly-issue.sh --list linux ~/m2-check >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-linux
          path: |
            ~/m2-check/*.tgz
            ~/m2-check/*/summary.txt
          retention-days: 14

  macos:
    if: github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    runs-on: macos-15
    timeout-minutes: 150
    outputs:
      flaky: ${{ steps.flaky.outputs.list }}
    env:
      # No Mac copy of the test plugins is pinned yet: their tests skip, and the suites that need
      # them are left out (and said).
      M2_NO_PLUGINS: 1
      # Its sleeps last about four times what they ask (the first nightly, run 40296575023), so the
      # tests whose clock is a sleep fail there with correct code: ci/pr.sh leaves out those
      # ci/sleeps-tests.txt and e2e/run.mjs's sleeps tags name, and its "late sleeps" row says
      # which. They run everywhere else, on a real Mac too.
      M2_LATE_SLEEPS: 1
      M2_PR_JOBS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/m2-tools
          key: m2-tools-${{ runner.os }}-${{ hashFiles('ci/tools.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: chrome-headless-shell-133.0.6943.141-${{ runner.os }}
      - run: ci/pr.sh toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target/pr
          shared-key: nightly-macos
      - run: ci/pr.sh rust --all
      # arm64 keeps fewer stores in order than x86, so an ordering too weak shows here first.
      - if: ${{ !cancelled() }}
        run: ci/pr.sh models
      - if: ${{ !cancelled() }}
        run: ci/pr.sh suites --all
      - if: ${{ !cancelled() }}
        run: ci/pr.sh renders
      # What passed only on a retry (each step's list), for the report job's "Flaky tests" issue.
      - id: flaky
        if: always()
        run: ci/nightly-issue.sh --list macos ~/m2-check >> "$GITHUB_OUTPUT"
      # Every night, as the Linux job's: a test that passed only on its retry has its logs too.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-macos
          # Every log, and nextest's JUnit report: each test's time (.config/nextest.toml).
          path: |
            ~/m2-check/
            target/nextest/default/junit.xml
          retention-days: 14

  # One issue for every failed night, "Nightly failed", and one for every night something passed
  # only on a retry, "Flaky tests": each opened once, commented on after. A job past its timeout
  # (a hang) ends "cancelled", not "failure", so both count; this workflow never cancels itself
  # (cancel-in-progress: false), so a cancelled job is a timeout or a person's click.
  report:
    needs: [linux, macos]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.linux.outputs.flaky != '' || needs.macos.outputs.flaky != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A job's own permissions replace the top-level ones: contents: read again, for the checkout.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHAT: "linux ${{ needs.linux.result }}, macos ${{ needs.macos.result }}"
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: ci/nightly-issue.sh "$RUN" "$WHAT"
      # The names reach the script through the environment, never pasted into it.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FLAKY: |
            ${{ needs.linux.outputs.flaky }}
            ${{ needs.macos.outputs.flaky }}
        if: ${{ !cancelled() && (needs.linux.outputs.flaky != '' || needs.macos.outputs.flaky != '') }}
        run: ci/nightly-issue.sh --flaky "$RUN" "$FLAKY"
