# .config/nextest.toml: how cargo-nextest runs music2's Rust tests (ci/pr.sh rust, the PR tier).
#
# In short: nextest runs each test in its own process, many at once, where `cargo test` runs one test
# binary at a time with its tests on threads. Some tests take a lock so that, inside their binary,
# only one of them runs at a time (they spin up thread pools or live engines, and tests beside them
# wait on clocks). In separate processes a lock guards nothing, so the groups below put back "one at
# a time" for exactly those tests. Keep them in step with the locks: WORKERS (core/play/src/tests.rs),
# ALONE (core/play/tests/stream.rs, churn.rs), ONE (core/pool, core/play/tests/engine_threads.rs),
# POOLS (core/play/tests/bit_identity.rs, core/runtime/src/tests.rs) and `one_listen`
# (apps/m2/tests/listen.rs: one `m2 listen` at a time, as on a machine, AGENT-7).

[test-groups]
pools = { max-threads = 1 }
play-workers = { max-threads = 1 }
play-stream = { max-threads = 1 }
play-churn = { max-threads = 1 }
listens = { max-threads = 1 }

[profile.default]
# Every test runs, as in ci/check.sh (--no-fail-fast). A test still running after a minute is
# named in the log as SLOW, every minute, and ended after 3 (a hang: it fails as TIMEOUT, its
# retry gets 3 minutes more), so a hang costs a CI job 6 minutes, not 20. The tests that take
# longer than that on correct code keep 10 minutes, by name: the last override below.
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
# A test that fails runs once more; one that passes then is reported FLAKY, and ci/pr.sh names it.
retries = 1
failure-output = "immediate-final"
# "slow": the SLOW lines too, as each minute passes, so even a job cut off by its own timeout
# leaves a log that names the test it was waiting on.
status-level = "slow"
final-status-level = "flaky"

# Each test's name, result and time, written at the end of a run to target/nextest/default/
# junit.xml; CI keeps it with the logs (of a failed Rust job of the PR tier, and of the Mac's
# nightly job every night): the times to judge a new limit by.
[profile.default.junit]
path = "junit.xml"

# One thread pool spinning at a time, across every binary: a single lock per binary did that under
# cargo test, which ran the binaries one after another.
[[profile.default.overrides]]
filter = 'binary_id(m2-play::bit_identity) | binary_id(m2-play::engine_threads) | (binary_id(m2-pool) & test(/^tests::/)) | (binary_id(m2-runtime) & (test(/^tests::parts::/) | test(=tests::live::keep::a_trap_on_any_thread_count_gives_the_same_bits) | test(=tests::live::keep::an_edit_window_renders_the_same_bits_on_1_and_n_threads)))'
test-group = 'pools'

[[profile.default.overrides]]
filter = 'binary_id(m2-play) & (test(=tests::a_device_player_let_go_stops_its_stream_and_frees_its_engine_elsewhere) | test(=engines::tests::a_device_without_real_time_plays_on_one_thread))'
test-group = 'play-workers'

[[profile.default.overrides]]
filter = 'binary_id(m2-play::stream)'
test-group = 'play-stream'

[[profile.default.overrides]]
filter = 'binary_id(m2-play::churn)'
test-group = 'play-churn'

[[profile.default.overrides]]
filter = 'binary_id(m2::listen)'
test-group = 'listens'

# The tests that take over a minute on correct code, measured: each was seen past 60 s
# (a SLOW line, or cargo test's "running for over 60 seconds") on some machine, so 3 minutes
# could end one on a slow or busy runner. They keep the old limit, 10 minutes. Measured
# 2026-10-26: alone on 4 cores (ci/nightly-tests.txt), in the nightly run on GitHub's Linux
# machine (cargo test, run 40296575023), and ci/pr.sh rust --all on 32 threads.
#   tx::kill_tests::...the_project_recovers                    133 s alone, 186 s on 32 threads
#   tx::kill_tests::...without_a_swap_the_project_recovers     160 s alone, 210 s on 32 threads
#   every_pure_fixture_renders_the_same_bits_on_1_and_n_threads  81 s alone, over 60 s nightly
#   live_on_n_threads_is_the_export_on_1                       86 s alone, over 60 s nightly
#   p16_renders_the_same_bits_on_1_and_4_threads               over 60 s nightly (10 s here)
# Every other test took under 60 s wherever it was named (the most, 42 s here), three times inside
# the limit. The Mac's nightly run counted 4 slow tests but didn't name them; its SLOW lines and
# JUnit report now do: check its first run. A test that comes near the limit gets its line here,
# with its times: never a longer limit for all.
[[profile.default.overrides]]
filter = '(binary_id(m2-session) & (test(=tx::kill_tests::killed_at_every_commit_step_the_project_recovers) | test(=tx::kill_tests::killed_at_every_commit_step_without_a_swap_the_project_recovers))) | (binary_id(m2-play::bit_identity) & (test(=every_pure_fixture_renders_the_same_bits_on_1_and_n_threads) | test(=live_on_n_threads_is_the_export_on_1) | test(=p16_renders_the_same_bits_on_1_and_4_threads)))'
slow-timeout = { period = "60s", terminate-after = 10 }
