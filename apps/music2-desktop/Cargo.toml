[package]
name = "music2-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "music2 as a native app: the React UI in a system webview around the Rust server"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
m2-server.workspace = true
m2-plugins.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
getrandom = "0.3"
anyhow.workspace = true
dirs.workspace = true
open.workspace = true

[dev-dependencies]
m2-os.workspace = true

# HOST-2: this test runs the app's hook on the process's real main thread, which libtest owns, and
# on macOS AppKit's event loop there.
[[test]]
name = "app_main_thread"
harness = false
